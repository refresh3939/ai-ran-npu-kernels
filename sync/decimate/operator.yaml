schema_version: 1

id: R0
name: decimate
category: sync
domain: sample_rate_conversion
chain: rx
chain_position: layer_0_before_pss_sss_acquisition
status: implemented
knowledge_status: extracted_static_verified_needs_npu_revalidation

paths:
  source: kernels/sync/decimate
  original_source: /home/refresh/AI-RAN-NPU/kernels/rx/decimate
  knowledge: kernels/sync/decimate/KNOWLEDGE.md
  readme: kernels/sync/decimate/README.md
  conversation: conversations/R0_decimate.md

target:
  architecture: dav_m200
  default_soc: Ascend310P3
  supported_soc_versions:
    - Ascend310P1
    - Ascend310P3
  historical_validated_soc: Ascend310P3
  historical_cann_version: 8.0.0
  migration_validation: static_only

inputs:
  - name: in_iq
    dtype: int16
    shape: [2457600]
    logical_shape: [1228800, 2]
    layout: interleaved_iq
    sample_rate_hz: 61440000
  - name: fir_taps
    dtype: float16
    shape: [96]
    layout: tap_major

outputs:
  - name: out_iq
    dtype: int16
    shape: [307200]
    logical_shape: [153600, 2]
    layout: interleaved_iq
    sample_rate_hz: 7680000

algorithm:
  family: fir_polyphase_decimator
  decimation_factor: 8
  input_complex_samples: 1228800
  output_complex_samples: 153600
  frame_duration_ms: 20
  fir_taps: 96
  phases: 8
  taps_per_phase: 12
  fir_window: kaiser
  kaiser_beta: 8.0
  cutoff_hz: 3840000
  group_delay_input_samples: 47.5
  boundary_condition: zero_for_negative_input_indices
  accumulation_dtype: float16
  coefficient_dtype: float16
  implementation: gather_mask_residue_streams_plus_axpy

execution:
  batch: 1
  batch_parameter: compile_time_fixed
  block_dim: 4
  output_per_core: 38400
  output_tile: 1280
  tiles_per_core: 30
  input_per_tile: 10240
  window_complex_samples: 10336
  padded_load_complex_samples: 11264
  max_copy_chunk_int16: 12288
  engine: aiv_vector
  tiling_mode: compile_time_constants
  warmup_iterations: 5
  timed_iterations: 20

commands:
  generate: python3 scripts/decimate_ref.py
  run: bash run.sh -r npu -v Ascend310P3
  profile: bash run.sh -r npu -v Ascend310P3 -p
  verify: python3 scripts/verify_result.py

