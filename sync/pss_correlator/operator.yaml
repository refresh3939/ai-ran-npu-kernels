  pss_candidates: 3
  integer_cfo_bins: [-1, 0, 1]
  quantization_fraction_bits: 13
  quantization_scale: 8192
  first_cp_samples: 44
  metric: squared_complex_correlation_magnitude

execution:
  engine: mixed_vector_cube_scalar_with_host_final_reduce
  batch:
    unit: search_window
    size: 1
    runtime_parameterized: false
  block_dim: 4
  stage1_tile_samples: 1920
  stage23_m_tile: 128
  stage23_mmad_m: 16
  stage23_k: 256
  stage23_n_padded: 16
  stage23_valid_n: 3
