      bytes: 16384
      current_generation_status: converter_exists_but_is_not_wired_into_run_sh
    - name: twiddle
      dtype: int16
      shape: [3, 153600, 2]
      layout: g_sample_interleaved_iq
      quantization: Q2.13
      bytes: 1843200
    - name: workspace
      dtype: uint8
      shape: platform_lib_api_workspace
    - name: tiling
      dtype: uint8
      shape: [sizeof_TCubeTiling]
      current_kernel_usage: placeholder
  internal_outputs:
    - name: stage1_yG
      dtype: float16
      shape: [3, 2, 153600]
      bytes: 1843200
    - name: per_tile_reduce
      dtype: float32
      shape: [3, 4, 300, 16]
      logical_fields_per_pss: [peak, local_index, sum, count]
      bytes: 230400
  physical_output:
    name: output
    dtype: uint16
    shape: [16]
    bytes: 32
    current_semantics: sentinel_debug_buffer_not_stable_five_scalar_abi
  logical_outputs:
    - {name: mu_t, dtype: int32, shape: [], meaning: pss_useful_start_sample}
    - {name: n_id_2, dtype: int32, shape: [], values: [0, 1, 2]}
    - {name: g_hat, dtype: int32, shape: [], values: [-1, 0, 1]}
    - {name: peak, dtype: float32, shape: []}
    - {name: noise_floor, dtype: float32, shape: [], contract_conflict: python_median_vs_historical_npu_mean}

