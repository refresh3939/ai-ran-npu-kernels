name: dmrs_gen_siso
aliases: [dmrs_gen]
category: sync
domain: sync
chain: tx
spatial_mode: siso
stage: pusch_dmrs_generation_before_resource_element_mapping
status: implemented_standalone_and_chain_source_adapted_needs_clean_revalidation
