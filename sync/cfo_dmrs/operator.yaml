    - Ascend310P1
    - Ascend310P3
  historical_cann_version: 8.0.0
  locally_detected_cann_version: 8.0.0
  build_cann_path_default: /usr/local/Ascend/ascend-toolkit/latest

interface:
  inputs:
    - name: y_re
      dtype: float16
      shape: [14, 1664]
      logical_valid_shape: [14, 1596]
      layout: split_real_symbol_major_zero_padded
      bytes: 46592
    - name: y_im
      dtype: float16
      shape: [14, 1664]
      logical_valid_shape: [14, 1596]
      layout: split_imag_symbol_major_zero_padded
      bytes: 46592
    - name: x_re
      dtype: float16
      shape: [2, 896]
      logical_valid_shape: [2, 798]
      layout: split_real_dmrs_symbol_major_zero_padded
      bytes: 3584
    - name: x_im
      dtype: float16
      shape: [2, 896]
      logical_valid_shape: [2, 798]
      layout: split_imag_dmrs_symbol_major_zero_padded
      bytes: 3584
    - name: scratch
      dtype: uint8
      shape: [128]
      current_kernel_usage: unused_parameter
    - name: workspace
      dtype: uint8
      shape: platform_lib_api_workspace
      current_kernel_usage: unused_parameter
    - name: tiling
      dtype: uint8
      shape: [128]
      current_kernel_usage: unused_zero_placeholder
  outputs:
    - name: result
      dtype: float32
      shape: [8]
      bytes: 32
      fields:
        - {index: 0, name: delta_f_hz, unit: Hz}
        - {index: 1, name: c_re, unit: normalized_correlation}
        - {index: 2, name: c_im, unit: normalized_correlation}
        - {range: "3:7", name: padding}
        - {index: 7, name: kernel_ran_sentinel, expected: 7.0}

algorithm:
  family: cross_dmrs_phase_rotation
  method: normalized_ls_cross_symbol_correlation
  formula: delta_f_hz=atan2(imag(sum(conj(H0)*H1)),real(sum(conj(H0)*H1)))/(2*pi*delta_t)
  y_normalization: y/sqrt(abs_y_squared+1e-6)
  fft_size: 2048
  sample_rate_hz: 61440000
  subcarrier_spacing_hz: 30000
  symbols_per_slot: 14
  active_subcarriers: 1596
  padded_subcarriers: 1664
  dmrs_symbols: [2, 11]
  dmrs_comb: 2
  dmrs_re_per_symbol: 798
  padded_dmrs_re: 896
  dmrs_symbol_distance: 9
  delta_t_us: 321.09375
  source_hz_per_rad: 495.6582031
  derived_hz_per_rad_approx: 495.665
  unambiguous_range_hz_approx: [-1557.18, 1557.18]
  atan_implementation: CANN_high_level_Atan_plus_scalar_quadrant_restore

execution:
  batch:
    unit: slot
    size: 1
    runtime_parameterized: false
  block_dim: 1
  engine: AIV_vector
  aiv_mapping_xor_2: false
  selected_aiv_id: 0
  gather:
    source_half_elements: 1664
    repeat_times: 13
    valid_even_outputs: 798
  reduction:
    dtype: float16
    padded_elements: 896
    first_stage: 7x128_to_7
    second_stage: 7_to_1
  normalization_math_dtype: float32
  tiling: zero_placeholder_128_bytes
  approximate_ub_bytes: 35000

commands:
  generate: python3 scripts/cfo_dmrs_ref.py
  run: bash run.sh -r npu -v Ascend310P3
  verify: python3 scripts/verify_result.py

correctness:
  status: source_adjacent_outputs_observed_clean_unverified
  reference: numpy_synthetic_dmrs_cfo
  reference_is_sionna: false
  kernel_reference_model_mismatch: python_reference_does_not_apply_current_y_normalization
  comparison: absolute_delta_f_error_hz_and_exact_sentinel
  cases:
    - {name: no_cfo, injected_hz: 0, tolerance_hz: 1}
    - {name: small_positive, injected_hz: 200, tolerance_hz: 5}
    - {name: large_negative, injected_hz: -1000, tolerance_hz: 5}
    - {name: doppler_only, injected_hz: 0, doppler_hz: 100, tolerance_hz: 200}
    - {name: cfo_plus_noise, injected_hz: 500, snr_db: 10, tolerance_hz: 50}
  success_pattern: "Total: 5 / 5 PASS"
