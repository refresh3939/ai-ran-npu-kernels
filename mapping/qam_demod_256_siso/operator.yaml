interface:
  inputs:
    - name: x_re
      dtype: fp16
      shape: [14, 1664]
      padding_contract: "subcarriers [1596,1664) equal 0"
    - name: x_im
      dtype: fp16
      shape: [14, 1664]
      padding_contract: "subcarriers [1596,1664) equal 0"
    - name: no_eff
      dtype: fp16
      shape: [14, 1664]
      constraints: [finite, greater_than_zero]
      padding_contract: "subcarriers [1596,1664) equal 1"
  outputs:
    - name: llr
      dtype: int16
      fixed_point: Q11.5
      physical_shape: [8, 12, 1600]
      allocation_shape: [8, 19200]
      layout: stream_major_symbol_padded
      valid_subcarriers_per_symbol: 1596
      padding_subcarriers_per_symbol: 4
      padding_value: 0
      padding_value_guaranteed_when_input_padding_contract_holds: true
      stream_order: [I_b3, I_b2, I_b1, I_b0, Q_b3, Q_b2, Q_b1, Q_b0]
      nr_bit_index_order: [0, 2, 4, 6, 1, 3, 5, 7]
      polarity: positive_means_bit_0
  abi_note: padded_output_is_not_legacy_strict_compact_despite_equal_total_bytes

algorithm:
  family: 5g_nr_256qam_soft_demapper
  approximation: max_log
  constellation: square_gray_256qam
  implementation: cancellation_safe_pairwise_hinge_formula
  normalization_expression: 1/sqrt(170)
  normalization_d: 0.07669649888473704
  pam_levels_per_axis: 16
  bits_per_symbol: 8
  quantization_scale: 32
  llr_clip_fx: 2560
  llr_clip_real: 80
  y_scaled_clip: 1000
  thresholds: [2, 4, 6, 8, 10, 12, 14]

geometry:
  physical_symbols: 14
  dmrs_symbols: [2, 11]
  data_symbols: 12
  subcarriers_used: 1596
  input_subcarriers_padded: 1664
  output_symbol_stride: 1600
  runtime_parameterized: false
  tiling_struct_present: true
  kernel_uses_tiling: false

execution:
