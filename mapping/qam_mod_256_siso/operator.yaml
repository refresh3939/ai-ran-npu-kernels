interface:
  inputs:
    - name: bits
      dtype: int16
      shape: [8, 12, 1600]
      layout: stream_data_symbol_padded_subcarrier
      stream_order: [I_c0_sign, I_c1, I_c2, I_c3, Q_c0_sign, Q_c1, Q_c2, Q_c3]
      corresponding_demod_order: [I_b3, I_b2, I_b1, I_b0, Q_b3, Q_b2, Q_b1, Q_b0]
      nr_bit_index_order: [0, 2, 4, 6, 1, 3, 5, 7]
      valid_per_symbol: 1596
      zero_padding_per_symbol: 4
      allocation_elements_per_stream: 19200
      constraints:
        - values_are_zero_or_one
        - four_padding_values_per_symbol_are_zero
      symmetry: matches_qam_demod_256_siso_output
  outputs:
    - name: x_re
      dtype: fp16
      shape: [14, 1664]
      layout: physical_symbol_by_padded_subcarrier
      valid_region: "non-DMRS symbols; subcarriers [0,1596)"
      zero_region: "DMRS symbols 2 and 11; subcarriers [1596,1664)"
    - name: x_im
      dtype: fp16
      shape: [14, 1664]
      layout: physical_symbol_by_padded_subcarrier
      valid_region: "non-DMRS symbols; subcarriers [0,1596)"
      zero_region: "DMRS symbols 2 and 11; subcarriers [1596,1664)"

algorithm:
  family: 5g_nr_256qam_modulation
  constellation: square_gray_256qam
  decomposition: independent_16pam_i_and_q
  bits_per_symbol: 8
  bits_per_axis: 4
  pam_levels: [-15, -13, -11, -9, -7, -5, -3, -1, 1, 3, 5, 7, 9, 11, 13, 15]
  level_formula: "d0 * (8 - d1 * (4 - d2 * (3 - 2*c3))), dk = 2*ck - 1"
  normalization_d: 0.07669649888473704
  normalization_expression: 1/sqrt(170)
  average_complex_symbol_power: 1
  max_axis_magnitude: 1.1504474832710556

geometry:
  physical_symbols: 14
  dmrs_symbols: [2, 11]
  data_symbols: 12
  subcarriers_used: 1596
  subcarriers_padded: 1664
  data_re: 19152
  input_stream_stride: 19200
  runtime_parameterized: false
  tiling_struct_present: true
  kernel_uses_tiling: false

execution:
  batch_semantics: one_slot_per_launch
  host_test_cases_sequential: 5
  block_dim: 4
  active_logical_aivs: 4
  block_index_mapping: "GetBlockIdx() xor 2"
  data_symbols_per_active_aiv: 3
  elements_per_active_aiv: 4800
  compute_dtype: fp16
  input_cast: int16_to_fp16_CAST_NONE
  estimated_ub_bytes_per_active_aiv: 112256
  workspace_bytes: 1048576
  workspace_used_by_kernel: false
  implementation: vector_batch3_padded
  sole_implementation: true

commands:
