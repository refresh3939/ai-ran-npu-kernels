  run_default: bash run.sh -r npu -v Ascend310P3
  run_ascend310p1: bash run.sh -r npu -v Ascend310P1
  verify_integrated: "main.cpp during run command"
  verify_one_case: python3 scripts/verify_result.py --data-root data --case case_0_random_a

