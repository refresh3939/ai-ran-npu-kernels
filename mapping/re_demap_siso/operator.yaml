interface:
  batch: one_slot_per_launch
  inputs:
    - name: in_re
      dtype: float16
      shape: [14, 2048]
      layout: symbol_major_raw_stage4_k1_k2
    - name: in_im
      dtype: float16
      shape: [14, 2048]
      layout: symbol_major_raw_stage4_k1_k2
    - name: gather_idx
      dtype: uint32
      shape: [1664]
      layout: fp16_byte_offsets
      generated_by: scripts/re_demap_ref.py
    - name: ws
      dtype: uint8
      host_allocated_bytes: 1024
      role: unused_dummy_tail_parameter
    - name: tiling
      dtype: uint8
      host_allocated_bytes: 1024
      role: unused_dummy_tail_parameter
  outputs:
    - name: out_re
      dtype: float16
      shape: [14, 1664]
      layout: symbol_major_natural_used_sc
      valid_region: "subcarriers [0,1596)"
      padding_region: "[1596,1664) copies raw input element 0; not guaranteed zero"
    - name: out_im
      dtype: float16
      shape: [14, 1664]
      layout: symbol_major_natural_used_sc
      valid_region: "subcarriers [0,1596)"
      padding_region: "[1596,1664) copies raw input element 0; not guaranteed zero"

algorithm:
  family: resource_element_demapping
  implementation: ascendc_gather_pure_permutation
  fft_size: 2048
  symbols_per_slot: 14
  resource_blocks: 133
  used_subcarriers: 1596
  padded_subcarriers: 1664
  left_guard_bins: 226
  right_guard_bins: 226
  dc_null: false
  dc_null_status: assumed_needs_final_resource_grid_confirmation
  mixed_radix_p: 32
  mixed_radix_q: 64
  natural_bin_to_raw_element: "64 * (n % 32) + floor(n / 32)"
  gather_offset_unit: byte
  padding_index_value_bytes: 0
  arithmetic: none

execution:
  batch_parameter: fixed_one_slot
  block_dim: 4
  symbols_per_core: 4
  symbol_assignment: contiguous_4_4_4_2
  gather_calls_per_slot: 28
  source_elements_per_gather: 2048
  destination_elements_per_gather: 1664
  index_loaded_once_per_core: true
  ub_buffers_bytes:
    source: 4096
    destination: 3328
    index: 6656
    total: 14080
  workspace_used_by_kernel: false
  tiling_used_by_kernel: false

commands:
  generate: python3 scripts/re_demap_ref.py
  run_default: bash run.sh -r npu -v Ascend310P3
  run_ascend310p1: bash run.sh -r npu -v Ascend310P1
  verify: python3 scripts/verify_result.py
  regenerate_after_index_change: python3 scripts/re_demap_ref.py

