  later_integrated_observations_us_per_tb: approximately_80_to_93_with_other_noisier_runs

conversation_provenance:
  standalone_complete_conversation_found: false
  related_complete_conversations:
    - name: rx_chain
      uuid: 67a19008-b741-4d63-918d-eda1b0f0909e
