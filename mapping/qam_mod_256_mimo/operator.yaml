schema_version: 1

id: qam_mod_256_mimo
name: qam_mod_256_mimo
category: mapping
domain: mapping
chain: tx
stage: pusch_compact_codeword_modulation
status: implemented_host_and_npu_verified

paths:
  source: kernels/mapping/qam_mod_256_mimo
  clean_destination: kernels/mapping/qam_mod_256_mimo
  shared_interface: kernels/common/pusch_mimo_types.h
  readme: kernels/mapping/qam_mod_256_mimo/README.md
  knowledge: kernels/mapping/qam_mod_256_mimo/KNOWLEDGE.md

target:
  architecture: dav_m200
  default_soc_version: Ascend310P1
  supported_soc_versions: [Ascend310P1, Ascend310P3]
  block_dim: 4
  compute_aivs: 3
  tail_clear_aivs: 1

io:
  input:
    name: bits_qam
    dtype: int16
    values: [0, 1]
    shape: [8, codeword_stride]
    stream_order: grouped_i0_i1_i2_i3_q0_q1_q2_q3
  outputs:
    - {name: d_re, dtype: fp16, shape: [codeword_stride]}
    - {name: d_im, dtype: fp16, shape: [codeword_stride]}
  valid_symbols_per_input_stream: num_layers_times_19152
  valid_output_symbols: num_layers_times_19152
  storage_stride: num_layers_times_19200
  output_padding: zero
  full_grid_output: false

algorithm:
  family: 5g_nr_256qam_modulation
  constellation: square_gray_256qam
  normalization: 1_over_sqrt_170_fp16
  qam_stream_to_nr_bit: [0, 2, 4, 6, 1, 3, 5, 7]
  input_permutation: none_already_grouped_by_scramble_mimo
  reference_math: qam_mod_256_siso_bit_exact

profile:
  supported_rank: [1, 2, 3, 4]
  num_data_re: 19152
  data_stride: 19200
  codeword_symbols: num_layers_times_19152
  codeword_stride: num_layers_times_19200
  downstream_contract: layer_map_build_current_profile

execution:
  form: native_single_launch
  tile_elements: 4096
  tiling_bytes: 128
  workspace_bytes: 128
  build_and_verify: bash run.sh

correctness:
  golden_reference: scripts/gen_data.py
  host_reference: ReferenceModulate
  contract_test: qam_mod_256_mimo_contract_test
  npu_verifier: scripts/verify_result.py
  checks:
    - rank_1_through_4_layer_map_profile_match
    - all_256_constellation_points_per_rank
    - cpp_reference_equals_independent_python
    - npu_fp16_elementwise_exact
    - compact_output_tail_zero
  current_validation:
    date: 2026-09-07
    build: pass_ascend310p1
    host_contract_rank_1_through_4: pass
    host_reference_rank_1_through_4: pass
    npu: pass_rank_1_through_4_fp16_elementwise_exact
    npu_p50_us: {rank1: 10.1, rank2: 19.6, rank3: 27.7, rank4: 23.6}

generated_artifacts:
  - build/**
  - out/**
  - data/**
  - scripts/__pycache__/**

known_limitations:
  - fixed_14_symbol_133rb_two_dmrs_geometry
  - one_codeword_and_one_slot_per_launch
  - int16_bits_are_not_bit_packed
  - device_kernel_does_not_validate_bit_domain
