schema_version: 1

id: T14
name: ofdm_mod_siso
aliases: [ofdm_mod]
category: ofdm
domain: ofdm
chain: tx
spatial_mode: siso
status: implemented_optimized_npu_verified
knowledge_status: current_source_audited_and_profiled

paths:
  source: kernels/ofdm/ofdm_mod_siso
  original_source: /home/refresh/AI-RAN-NPU/kernels/tx/ofdm_mod
  verified_optimization_source: /home/refresh/AI-RAN-NPU/kernels/tx/ofdm_mod_mimo_opt
  knowledge: kernels/ofdm/ofdm_mod_siso/KNOWLEDGE.md
  conversation: conversations/T14_ofdm_mod.md

target:
  architecture: dav_m200
  supported_soc_versions:
    - Ascend310P1
    - Ascend310P3
  default_soc_version: Ascend310P1
  cann_package_path: /usr/local/Ascend/ascend-toolkit/latest
  cann_version: 8.0.0

interface:
  inputs:
    - name: input_re
      dtype: float16
      shape: [14, 32, 64]
      physical_shape: [28672]
      layout: s4_mixed_radix_flat_b1_times_64_plus_b2
    - name: input_im
      dtype: float16
      shape: [14, 32, 64]
      physical_shape: [28672]
      layout: s4_mixed_radix_flat_b1_times_64_plus_b2
  outputs:
    - name: output_re
      dtype: int16
      shape: [30720]
      layout: natural_time_with_cp
      scale: 1600.0
    - name: output_im
      dtype: int16
      shape: [30720]
      layout: natural_time_with_cp
      scale: 1600.0
    - name: output_iq
      dtype: int16
      shape: [30720, 2]
      physical_shape: [61440]
      layout: interleaved_iq_natural_time_with_cp
      scale: 1600.0
  input_bin_mapping: "natural_bin_k = b1 + 32*b2"
  output_contract: unitary_time_domain_times_air_scale_then_rint_int16_with_cp

algorithm:
  family: 5g_nr_cp_ofdm_modulation
  implementation: reverse_mixed_radix_32x64_low_level_mmad
  fft_size: 2048
  symbols_per_slot: 14
  samples_per_slot: 30720
  cyclic_prefix_lengths:
    first: 176
    other: 144
  radix_p: 32
  radix_q: 64
  stages:
    - idft64_unitary
    - inverse_twiddle
    - idft32_unitary
    - air_scale_rint_int16
    - cyclic_prefix_insert
    - iq_interleave
  weight_normalization:
    idft64: 0.125
    idft32: 0.1767766952966369
    total: 0.02209708691207961
    convention: unitary_1_over_sqrt_n
  air_scale: 1600.0
  complex_matmul_lowering: four_real_mmad_with_fused_accumulation
  phase_a:
    m_full_core: 128
    m_tail_core: 64
    k: 64
    n: 64
  phase_c:
    m: 32
    k: 32
    n: 64
    rhs_tile_n: 16
    rhs_transfer_reuse: one_gm_l1_l0b_load_serves_real_and_imag_mmad
    l0c_accumulators: 2
    symbol_retirement_barrier: PIPE_ALL
  n_sub: 16
  n_splits: 4

execution:
  batch_parameter: compile_time_single_slot
  batch_slots: 1
  block_dim: 4
  symbols_per_core_capacity: 4
  symbol_assignment: contiguous_4_4_4_2
  phase_a_symbol_batching: m_dimension_4_4_4_2
  scratch_bytes_per_core: 32768
  scratch_layout: two_float16_planes_each_4_by_2048
  warmup_runs: 10
  timed_runs: 50
  tiling_mode: placeholder_generated_but_not_consumed_by_kernel
  workspace_consumed_by_kernel: false
  resident_weights:
    l0a_w32_bytes: 6144
    l0b_w64_bytes: 24576
  static_memory_bytes:
    ub: 135168
    l1: 79872
    l0a: 38912
    l0b: 40960
    l0c: 16384

commands:
  generate: python3 scripts/ofdm_mod_ref.py
  run_ascend310p3: bash run.sh -r npu -v Ascend310P3
  run_ascend310p1: bash run.sh -r npu -v Ascend310P1
  verify: python3 scripts/verify_result.py

correctness:
  reference: data/golden/output_re.bin_and_output_im.bin
  comparison: dequantized_per_symbol_and_full_slot_max_abs_error_plus_bit_exact_iq_interleave
  dequant_scale: 1600.0
  absolute_tolerance: 0.05
  required_symbols_passed: 14
  cyclic_prefix_required: true
  iq_interleave_required: true
  success_pattern: "[verify] ========== PASS (14/14, CP OK, IQ OK) =========="
  clean_migration_status: source_cmp_to_verified_experiment
  current_ascend310p1:
    status: pass
    symbols_passed: 14
    body_max_abs_error: 0.0019
    full_slot_max_abs_error: 0.0019
    error_to_signal_rms_percent: 0.21
    iq_mismatches: 0
    output_cmp_original:
      output_re: bit_identical
      output_im: one_of_30720_samples_differs_by_one_lsb
      output_iq: corresponding_one_sample_differs_by_one_lsb
    repeated_full_runs_passed: 3
  historical_final_unitary:
    status: pass
    symbols_passed: 14
    body_max_abs_error: 0.0019
    full_slot_max_abs_error: 0.0019
    error_to_signal_rms_percent: 0.21
    iq_mismatches: 0
  python_self_checks:
    unitary_ifft_vs_numpy: required
    four_real_vs_complex: required
    unitary_roundtrip: required
    sionna: optional_backend_dependent

