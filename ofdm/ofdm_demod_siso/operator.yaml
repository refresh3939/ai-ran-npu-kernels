schema_version: 1

id: R5
name: ofdm_demod_siso
aliases: [ofdm_demod]
category: ofdm
domain: ofdm
chain: rx
spatial_mode: siso
status: implemented_npu_verified_single_slot
knowledge_status: extracted_current_source_audited

paths:
  source: kernels/ofdm/ofdm_demod_siso
  original_source: /home/refresh/AI-RAN-NPU/kernels/rx/ofdm_demod
  knowledge: kernels/ofdm/ofdm_demod_siso/KNOWLEDGE.md
  conversation: conversations/R5_ofdm_demod.md

target:
  architecture: dav_m200
  supported_soc_versions:
    - Ascend310P1
    - Ascend310P3
  default_soc_version: Ascend310P3
  historical_cann_version: 8.0.0
  current_cann_requirement: not_pinned

interface:
  input:
    name: input_iq
    dtype: int16
    logical_dtype: complex_q8_8
    shape: [30720, 2]
    layout: interleaved_iq
    contains_cyclic_prefix: true
  outputs:
    - name: output_re
      dtype: float16
      shape: [14, 32, 64]
      layout: stage4_dft64_nd
    - name: output_im
      dtype: float16
      shape: [14, 32, 64]
      layout: stage4_dft64_nd
  output_contract: unitary_unshifted_stage4_not_final_fftshifted_output

algorithm:
  family: 5g_nr_cp_ofdm_demod
  implementation: mixed_radix_32x64_low_level_mmad
  fused_chain_steps:
    - cp_removal
    - fft_2048_core
  fft_size: 2048
  symbols_per_slot: 14
  samples_per_slot: 30720
  cyclic_prefix_lengths:
    first: 176
    other: 144
  radix_p: 32
  radix_q: 64
  input_scale: 0.00390625
  unitary_normalization_in_kernel: true
  unitary_normalization_method: folded_into_dft32_and_dft64_weights
  phase_compensation_in_kernel: false
  fftshift_in_kernel: false
  complex_matmul_lowering: four_real_mmad
  fused_mmad_accumulation: true
  phase1_rhs_tile_reused_for_real_and_imag_outputs: true
  phase1_weights_resident_in_l0a: true
  phase3_symbols_stacked_on_m: true
  phase3_weights_resident_in_l0b: true
  max_phase3_m: 128
  n_sub: 16
  n_splits: 4
  phase1_k: 32
  phase3_k: 64

execution:
  batch_parameter: compile_time_single_slot
  batch_slots: 1
  block_dim: 4
  symbols_per_core_capacity: 4
  symbol_assignment: contiguous_4_4_4_2
  scratch_allocated_bytes_per_core: 32768
  scratch_kernel_stride_bytes_per_core: 32768
  scratch_lifetime_aliasing: xre_xim_reused_as_twre_twim
  optional_batch_scratch_bytes_per_core: 65536
  optional_batch_scratch_lifetime_aliasing: disabled_due_observed_mte_race
  inter_core_sync: none_in_default_single_slot_phase_barriers_in_optional_batch
  local_scratch_dependency: mte3_to_mte2_event
  tiling_mode: placeholder_not_consumed_by_kernel
  workspace_consumed_by_kernel: false

commands:
  generate: python3 scripts/ofdm_demod_ref.py
  run_ascend310p3: bash run.sh -r npu -v Ascend310P3
  run_ascend310p1: bash run.sh -r npu -v Ascend310P1
  verify: python3 scripts/verify_result.py

correctness:
  reference_primary: data/golden/stage4_dft64.bin
  reference_optional: Sionna_OFDMDemodulator
  comparison: per_symbol_max_abs_error_re_and_im
  absolute_tolerance: 0.05
  required_symbols_passed: 14
  success_pattern: "[verify] ========== PASS (14/14) =========="
  current_exact_source_status: pass_14_of_14_on_original_source_build
  current_overall_max_abs_error: 0.0018
  golden_input_basis: dequantized_saved_q8_8_input
  python_self_checks:
    mixed_radix_vs_numpy_atol: 0.0001
    four_real_vs_complex_atol: 0.0001
    sionna_atol: 0.001

performance:
