  sign_definition: sign_equals_1_minus_2c
  gold_nc: 1600
  c_init_formula: "((n_RNTI & 0xffff) << 15) | ((q & 1) << 14) | (N_ID_cell & 0x3ff)"
  current_rx_chain_parameters:
    n_RNTI: 12345
    q: 0
    N_ID_cell: SyncState.cell_id
  qam_stream_to_nr_bit: [0, 2, 4, 6, 1, 3, 5, 7]
  nr_bit_to_qam_stream: [0, 4, 1, 5, 2, 6, 3, 7]
  gold_generation_extent: valid_23_by_19152_by_8_excluding_storage_padding
  gold_reset_policy: one_continuous_sequence_for_full_transport_block_buffer
  qam_symbol_padding_compacted_by_kernel: true
  stream_permutation_performed_by_kernel: true
  code_block_segmentation_performed_by_kernel: false
  q_format_conversion_performed_by_kernel: false

