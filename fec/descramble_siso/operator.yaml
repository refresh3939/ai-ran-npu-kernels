      shape: [16]
      used_elements: [0]
      valid_runtime_range: [0, 23]
      out_of_range_policy: clamp_to_23
    - name: workspace
      dtype: opaque_gm
      used: false
      purpose: combined_build_launch_abi_tail
    - name: tiling
      dtype: opaque_gm
      size_bytes: 128
      used: false
      purpose: combined_build_launch_abi_tail
  outputs:
    - name: llr_out_gm
      dtype: int16
      q_format: Q11.5
      shape: [23, 8, 19200]
      layout: slot_nr_bit_compact_re
      stream_order: canonical_nr_bit_0_through_7
      valid_re_per_stream_per_slot: 19152
      padding_re_per_stream_per_slot: 48
