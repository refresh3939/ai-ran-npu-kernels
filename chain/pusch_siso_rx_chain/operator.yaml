    - Ascend310P3
  historical_cann_version: 8.0.0
  clean_runtime_verified: false

interface:
  spatial_mode: siso
  num_rx_antennas: 1
  num_layers: 1
  num_codewords: 1
  abi_scope: fixed_single_antenna_single_layer
  unsupported_interfaces:
    - mimo_channel_tensor_H_num_rx_by_num_layers
    - layer_mapper_demapper
    - multi_antenna_input_buffers
    - precoding_matrix
    - mimo_detector
  inputs:
    - name: capture_iq
      dtype: int16_interleaved_iq
      shape: [1228800, 2]
      bytes: 4915200
      sample_rate_hz: 61440000
  outputs:
    - name: information_bits
      dtype: int8_bits_stored_as_bytes
      shape: [143, 8448]
      bytes: 1208064
  intermediate_layouts:
    slot_iq: {dtype: int16_interleaved_iq, shape: [30720, 2]}
    fft_grid_re_im_planes: {dtype: fp16, shape_per_plane: [14, 2048]}
    used_grid_re_im_planes: {dtype: fp16, shape_per_plane: [14, 1664], valid_subcarriers: 1596}
    channel_re_im_planes: {dtype: fp16, shape_per_plane: [14, 1664]}
    equalized_re_im_noeff_planes: {dtype: fp16, shape_per_plane: [14, 1664]}
    qam_llr_padded: {dtype: int16, physical_shape: [23, 8, 12, 1600], qam_stream_to_nr_bit: [0, 2, 4, 6, 1, 3, 5, 7]}
    descrambled_llr_compact: {dtype: int16, shape: [23, 8, 19200], stream_order: canonical_nr_bit_0_through_7, valid_re_per_stream_slot: 19152}
    ldpc_lambda: {dtype: int16, shape: [143, 26112]}

algorithm:
  family: 5g_nr_pusch_siso_rx
  stages_acquire:
    - decimate
    - pss_correlator
    - pss_cfo_estimator
    - sss_correlator
    - ssb_fft
    - pbch_dmrs_correlator
  stages_per_slot:
    - win_slice
    - cfo_estimate
    - cfo_compensate
    - ofdm_demod
    - re_demap
    - channel_est_ls
    - equalize
    - qam256_demod
    - cfo_dmrs
    - timing_tracker
  stages_per_tb:
    - descramble
    - rate_dematch
    - ldpc_decode
  excluded_standalone_stage: llr_assemble
  excluded_stage_reason: qam_padding_compaction_and_stream_permutation_are_fused_into_descramble
  subcarrier_spacing_hz: 30000
  fft_size: 2048
  symbols_per_slot: 14
  samples_per_slot: 30720
  slots_per_tb: 23
  resource_blocks: 133
  used_subcarriers: 1596
  used_subcarriers_padded: 1664
  modulation: 256QAM
  dmrs_symbols: [2, 11]
  ldpc:
    base_graph: BG1
    lifting_size: 384
    code_blocks: 143
    information_bits_per_cb: 8448
    full_llr_per_cb: 26112
    check_block_rows: 46
    base_graph_edges: 316
  fixed_pusch_offset_samples: 52640

execution:
  batch:
    parameterization: compile_time
    slots: 23
    code_blocks: 143
  block_dim: 4
  block_dim_override_env: RX_BLOCKDIM
  stream_count: 1
  workspace_initial_bytes: 16777216
  generator_commands:
    - "python3 scripts/gen_gold_sign.py data/weights/gold_sign.bin"
    - "bash gen_tiling_shims.sh"
    - "Generate every child operator weight/reference with its reviewed Python generator"
  build_command: "bash run.sh"
  run_command: "RX_PROFILE=0 bash run.sh"
  benchmark_command: "RX_PROFILE=1 bash run.sh"
  loopback_command: "RX_LB_IQ=/path/to/tx_iq.bin RX_LB_BER=1 RX_LB_TXBITS=/path/to/tx_bits.bin RX_CELL_ID=1 bash run.sh --loopback"
  current_clean_availability: source_integrated_generated_weights_still_required
  qam_kernel_source: mapping/qam_demod_256_siso/qam256_demod_kernel.cpp
  qam_kernel_output_abi: padded_8_by_12_by_1600

