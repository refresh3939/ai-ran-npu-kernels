schema_version: 1

id: R13
name: mimo_detect_bri_batch
aliases: [mimo_detect]
implementation_name: mimo_detect_bri_sparse_final
category: mimo
chain: rx
chain_position: after_matrix_channel_estimation_before_per_layer_qam_demodulation
status: implemented_device_verified_clean_final
knowledge_status: current_source_checked_conversation_archived

paths:
  source: kernels/mimo/mimo_detect_bri_batch
  canonical_algorithm_source: /home/refresh/AI-RAN-NPU/kernels/rx/mimo_detect_bri_batch
  optimization_source: /home/refresh/AI-RAN-NPU/kernels/rx/mimo_detect_bri_re_multibuf
  knowledge: kernels/mimo/mimo_detect_bri_batch/KNOWLEDGE.md
  conversation: conversations/R13_mimo_detect.md
  conversations:
    - conversations/R13_mimo_detect.md
    - conversations/R13_mimo_detect_v2.md

target:
  architecture: dav_m200
  default_soc: Ascend310P1
  supported_soc:
    - Ascend310P1
    - Ascend310P3
  cann_version: "8.0.0"
  cann_component_version: "7.6.0.1.220"
  cann_path: /usr/local/Ascend/ascend-toolkit/latest

interface:
  batch: one_5g_grid_per_host_invocation
  symbols: 14
  padded_subcarriers_default: 1664
  used_subcarriers_per_symbol: 1596
  n_re_default: 23296
  physical_layers: 16
  logical_layers_parameter: NL_REAL
  complex_storage: separate_real_imaginary
  input_dtype: fp16
  cube_accumulator_dtype: fp32
  vector_unbias_dtype: fp32
  output_dtype: fp16
  inputs:
    - name: h_re
      file: hrm_re.bin
      shape: [N_RE, NR, 16]
      dtype: fp16
    - name: h_im
      file: hrm_im.bin
      shape: [N_RE, NR, 16]
      dtype: fp16
    - name: no
      file: no.bin
      shape: [N_RE]
      dtype: fp16
    - name: yv_re
      file: yvpad_re.bin
      shape: [N_RE, NR, 16]
      dtype: fp16
      semantics: received_vector_repeated_in_all_16_rhs_columns
    - name: yv_im
      file: yvpad_im.bin
      shape: [N_RE, NR, 16]
      dtype: fp16
      semantics: received_vector_repeated_in_all_16_rhs_columns
    - name: y_re_y_im_workspace_tiling
      semantics: legacy_abi_placeholders
  outputs:
    - name: xhat_re
      shape: [16, N_RE]
      dtype: fp16
      layout: layer_major_re_minor
    - name: xhat_im
      shape: [16, N_RE]
      dtype: fp16
      layout: layer_major_re_minor
    - name: no_eff
      shape: [16, N_RE]
      dtype: fp16
      layout: layer_major_re_minor
  packing:
    parameter: PACK
    supported: false
    required_value: 0
    reason: sparse_match_detect_final_path_is_validated_only_for_one_re_per_unit
  internal_rhs_adapter:
    source: kernels/common/bri_grouped_rhs_adapter.h
    public_input: repeated_y_[N_RE,NR,16]
    kernel_input: grouped_y_[N_RE_div_8,NR,16]
    group_size: 8
    placement: after_public_ABI_validation_before_device_upload

algorithm:
  family: unbiased_lmmse_with_block_richardson_inverse
  noise_model: white_sigma_squared_identity
  gram: "A = H^H H + sigma2 I"
  matched_filter: "m = H^H y"
  preconditioner: block_diagonal_of_A
  block_inverse: diagonal_scaled_neumann
  neumann_iterations: 3
  neumann_terms: 4
  neumann_initialization: "S = I + E; then form I + E + E^2 + E^3 without E*I Cube"
  richardson_iterations: 5
  richardson_rewrite: "C=I-M^-1 A; X <- M^-1 + C X"
  estimate: "xhat = (X m) / d"
  gain: "d = max(1 - sigma2*real(diag(X)), 1e-3)"
  effective_noise: "no_eff = (1-d)/d"
  core_parameters:
    nr_default: 64
    physical_nl: 16
    nl_real_default: 16
    block_size_default: 8
    group_batch_fixed: 8
    installed_chain_variants:
      - {name: rx16_layer16_rank4, nr: 16, nl_real: 4, block_size: 2, pack: 0}
      - {name: rx64_layer16_rank1_4, nr: 64, nl_real: 1_to_4, block_size: 8, pack: 0}
    re_batch_default: 64
    re_window_default: 5824
    l1_ring_depth_fixed: 2
    block_dim_fixed: 4
  convergence_checks:
    - "2*BRI_B >= NL_REAL"
    - "NR >= 8*min(BRI_B, NL_REAL)"

execution:
  block_dim: 4
  core_type: AIC_with_cube_and_vector
  group_batch: 8
  re_batch_default: 64
  re_batch_supported: [16, 32, 64]
  re_window_default: 5824
  re_window_semantics: one_contiguous_full_core_window_with_64_re_output_staging
  l1_ring_depth: 2
  task_mapping: contiguous_units_per_core
  experimental_mode_switches: removed
  intermediate_dump_paths: removed
  compile_time_dimensions:
    - NR
    - physical_NL
    - NL_REAL
    - BRI_B
    - PACK
    - N_SC_PAD
    - RE_BATCH
    - RE_WINDOW
  static_constraints:
    - "NR % 16 == 0"
    - "physical_NL == 16"
    - "N_UNIT/4 is divisible by RE_BATCH"
    - "NR <= 96 for the fixed GB=8 L0A layout"
    - "L0A/L0B/L0C capacity assertions pass"
  host_timing:
    warmup_runs_default: 3
    timed_runs_default: 20
    statistic: p50
    scope: kernel_launch_plus_aclrtSynchronizeStream

commands:
  generate: >-
    NR=64 NL=16 NL_REAL=16 BRI_B=8 PACK=0 AIRAN_SCPAD=1664
    AIRAN_DATA_DIR="$PWD/data" PYTHONDONTWRITEBYTECODE=1
    python3 scripts/mimo_detect_bri_ref.py
  run: >-
    bash run.sh -r npu -v Ascend310P1
  quick_run: >-
    NR=16 NL_REAL=4 BRI_B=2 AIRAN_WARMUP=0 AIRAN_TIMED=1 bash run.sh
  verify: >-
    NR=64 NL=16 NL_REAL=16 PACK=0 AIRAN_SCPAD=1664
    PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_result.py

